<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B57">
<meta name="description" content="Codzienny plan ćwiczeń na pianinie według RCM.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Plan przy pianinie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow practice column (phone at the piano); today's plan drawn as a row of piano keys, blocks stacked under it. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#E9EBE6; --ink:#16181D; --muted:#5B6169; --line:#D8DBD4;
  --accent:#1E6B57; --accent-ink:#FFFFFF; --accent-soft:#E0EEE8;
  --c-tech:#A9741C; --c-tech-soft:#F5EAD3;
  --c-mind:#3E5C8A; --c-mind-soft:#E3E9F3;
  --c-music:#1E6B57; --c-music-soft:#E0EEE8;
  --danger:#A63A2B; --ok:#2F7A3E;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111316; --surface:#1A1D21; --sunk:#23272C; --ink:#ECEDEA; --muted:#A0A6AD; --line:#2E3338;
  --accent:#62C3A2; --accent-ink:#0B1A14; --accent-soft:#1B2F28;
  --c-tech:#E2B060; --c-tech-soft:#352A16; --c-mind:#8FAEE0; --c-mind-soft:#1F2838;
  --c-music:#62C3A2; --c-music-soft:#1B2F28; --danger:#EE8B7B; --ok:#7CCB8B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1A1D21; --sunk:#23272C; --ink:#ECEDEA; --muted:#A0A6AD; --line:#2E3338;
  --accent:#62C3A2; --accent-ink:#0B1A14; --accent-soft:#1B2F28;
  --c-tech:#E2B060; --c-tech-soft:#352A16; --c-mind:#8FAEE0; --c-mind-soft:#1F2838;
  --c-music:#62C3A2; --c-music-soft:#1B2F28; --danger:#EE8B7B; --ok:#7CCB8B; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
.wrap{max-width:720px;margin:0 auto;padding-block:12px 96px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem;font-weight:500}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.levelchip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:.875rem}
.levelchip b{background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 10px;font-family:var(--f-display)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{flex:1;max-width:180px;background:none;border:0;padding:10px 4px 12px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
/* piano-key timeline */
.keys{display:flex;gap:3px;height:74px;margin:6px 0 4px}
.key{position:relative;flex-basis:0;min-width:18px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 7px 7px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:.72rem;color:var(--muted);overflow:hidden}
.key::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--kc)}
.key.done{background:var(--kcs)}
.key.done::after{content:"✓";position:absolute;top:16px;font-weight:700;color:var(--kc)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--kc);margin-right:5px;vertical-align:-1px}
.t-tech{--kc:var(--c-tech);--kcs:var(--c-tech-soft)}
.t-mind{--kc:var(--c-mind);--kcs:var(--c-mind-soft)}
.t-music{--kc:var(--c-music);--kcs:var(--c-music-soft)}
/* plan blocks */
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.block > .bh{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.block .tag{width:6px;align-self:stretch;border-radius:3px;background:var(--kc);flex:none}
.block .bh .ttl{flex:1;min-width:0}
.block .bh .ttl h3{line-height:1.25}
.block .min{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.block .bb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.block .bb p,.block .bb ol,.block .bb ul,.card.stack > p{margin:0}
.block .bb > .btn{align-self:flex-start}
.block.isdone{opacity:.72}
.block.isdone .bh{background:var(--kcs)}
.check{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 8px;font-size:.88rem}
.check .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.8rem;color:transparent}
.check[aria-pressed="true"]{border-color:var(--kc);background:var(--kcs)}
.check[aria-pressed="true"] .box{background:var(--kc);border-color:var(--kc);color:var(--surface)}
ul.tips{margin:0;padding-left:1.1rem} ul.tips li{margin:2px 0}
.tipgrp{font-size:.92rem} .tipgrp b{font-weight:600}
details{border-top:1px dashed var(--line);padding-top:8px}
details summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.own{background:var(--accent-soft);color:var(--accent)}
.timer{font-family:var(--f-mono);font-size:1.05rem;min-width:64px;text-align:right}
.status{display:flex;gap:4px;flex-wrap:wrap}
.status button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:.78rem}
.status button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rate{display:flex;gap:6px}
.rate button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono)}
.rate button[aria-pressed="true"]{background:var(--c-mind);color:var(--surface);border-color:var(--c-mind)}
/* progress */
.bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--kc,var(--accent));border-radius:99px}
.big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1}
.ladder{display:flex;gap:4px;margin-top:6px}
.ladder span{flex:1;height:22px;border-radius:5px;background:var(--sunk);font-size:.7rem;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono)}
.ladder span.on{background:var(--kc);color:var(--surface)}
.ladder span.cur{outline:2px solid var(--kc);outline-offset:-2px;color:var(--ink)}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:1px solid var(--line);padding-top:6px}
.chart div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.chart div.zero{background:var(--line)}
.chartx{display:flex;gap:4px;font-size:.66rem;color:var(--muted);font-family:var(--f-mono)}
.chartx span{flex:1;text-align:center}
.piece{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.piece:first-child{border-top:0}
.listhead{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.listhead .lt{font-family:var(--f-display);font-weight:700;font-size:1.4rem;color:var(--accent)}
/* quiz */
.staff{width:100%;max-width:320px;height:auto;display:block;margin:0 auto}
.staff line,.staff .ink{stroke:var(--ink)}
.staff text,.staff ellipse{fill:var(--ink)}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.answers.wide{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.answers button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:600}
.answers button.right{background:var(--c-music-soft);border-color:var(--ok);color:var(--ok)}
.answers button.wrong{background:transparent;border-color:var(--danger);color:var(--danger)}
.metro{display:flex;flex-direction:column;gap:10px;align-items:center}
.metro .bpm{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
.dots{display:flex;gap:8px} .dots i{width:14px;height:14px;border-radius:50%;background:var(--sunk)} .dots i.on{background:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text],select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:9}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.mini{background:var(--sunk);border-radius:12px;padding:10px 12px}
.mini .v{font-family:var(--f-display);font-size:1.4rem;font-weight:700}
.note{background:var(--c-tech-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.sync{font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
/* new modules: notation, lessons, ear input, exam */
.abc{width:100%;overflow-x:auto;color:var(--ink)}
.abc svg{max-width:100%;height:auto}
.lesson{font-size:1rem;line-height:1.65}
.lesson h2{margin-top:4px}
.lesson h4{font-family:var(--f-display);font-size:1rem;margin:14px 0 4px}
.lesson p,.lesson ul,.lesson ol{margin:6px 0}
.lesson table{border-collapse:collapse;font-size:.9rem}
.lesson td,.lesson th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.tablewrap{overflow-x:auto}
.box{background:var(--sunk);border-radius:12px;padding:10px 14px}
.box.tip{background:var(--c-tech-soft)}
.box.ok{background:var(--c-music-soft)}
.check-q{display:flex;flex-direction:column;gap:6px}
.check-q .opts{display:flex;flex-wrap:wrap;gap:6px}
.check-q .opts button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px}
.check-q .opts button.right{border-color:var(--ok);color:var(--ok);background:var(--c-music-soft)}
.check-q .opts button.wrong{border-color:var(--danger);color:var(--danger)}
.tapbtn{width:100%;height:120px;border-radius:18px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-size:1.4rem;font-weight:700;touch-action:manipulation;user-select:none}
.tapbtn:active,.tapbtn.hit{background:var(--accent);color:var(--accent-ink)}
.kbd{position:relative;height:130px;display:flex;user-select:none;touch-action:manipulation}
.kbd .w{flex:1;border:1px solid var(--line);border-radius:0 0 8px 8px;background:var(--surface);position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:.7rem;color:var(--muted)}
.kbd .w:active,.kbd .w.on{background:var(--accent-soft)}
.kbd .b{position:absolute;top:0;height:60%;background:var(--ink);border-radius:0 0 6px 6px;z-index:2}
.kbd .b:active,.kbd .b.on{background:var(--accent)}
.seqline{display:flex;gap:6px;flex-wrap:wrap;min-height:32px}
.seqline span{font-family:var(--f-mono);background:var(--sunk);border-radius:8px;padding:4px 8px}
.rubric label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.rubric input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.spark{display:block}
.spark .ln{stroke:var(--accent);fill:none;stroke-width:2}
.spark .tg{stroke:var(--c-tech);stroke-dasharray:3 3;stroke-width:1}
.spark circle{fill:var(--accent)}
.lessonlist button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 2px}
.lessonlist button:first-child{border-top:0}
.lessonlist .ok{color:var(--ok);font-weight:700}
input[type=number]{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;width:5.5em}
.grade-badge{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:1.1rem;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
:root{padding-top:env(safe-area-inset-top,0px)}
input[type=email],input[type=password]{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="today-label">Dzisiaj</div>
      <h1>Plan przy pianinie</h1>
    </div>
    <div class="row">
      <span class="levelchip"><b id="chip-grade">Grade 5</b><span id="chip-pct">0% do kolejnego</span></span>
      <button class="btn sm" id="acct-btn" data-act="acct" hidden>Zaloguj</button>
    </div>
  </header>
  <main id="view"><div class="card muted">Ładuję Twój plan…</div></main>
  <p class="sync" id="sync"></p>
</div>
<nav class="tabs" aria-label="Sekcje">
  <button data-tab="today" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Dziś</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Postęp</button>
  <button data-tab="rep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Utwory</button>
  <button data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>Nauka</button>
  <button data-tab="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8l-2-17h-4z"/><path d="M12 14l5-8"/></svg>Narzędzia</button>
</nav>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.4.4/abcjs-basic-min.js" defer></script>
<script src="content.js"></script>
<script src="extra.js"></script>
<script>
"use strict";
/* ============================== DANE ============================== */

  ["C-dur","a-moll",0],["G-dur","e-moll",1],["D-dur","h-moll",2],["A-dur","fis-moll",3],["E-dur","cis-moll",4],["H-dur","gis-moll",5],
  ["Fis-dur","dis-moll",6],["Des-dur","b-moll",-5],["As-dur","f-moll",-4],["Es-dur","c-moll",-3],["B-dur","g-moll",-2],["F-dur","d-moll",-1]

// saveLocal: automatic changes (today's plan generated). save: user actions, which also sync.
function saveLocal(){ pruneOld(); lsSet(S); }

}
function setSync(t){const el=document.getElementById("sync"); if(el) el.textContent=t;}
function pruneOld(){
  const keys=Object.keys(S.plans).sort();
  while(keys.length>70){ delete S.plans[keys.shift()]; }
  if(S.sr.log.length>300) S.sr.log=S.sr.log.slice(-300);

}

/* Synchronizacja: Firebase wspólny z Arabeską; ta aplikacja pisze do piano/{uid}, Arabeska do users/{uid}. */
async function push(){
  if(!SYNC.ref) return;
  if(SYNC.busy){ SYNC.dirty=true; return; }
  SYNC.busy=true;
  if(!navigator.onLine) setSync("Offline – zsynchronizuję, gdy wróci internet.");
  try{
    await SYNC.ref.set({updatedAt:S.updated||Date.now(), data:JSON.parse(JSON.stringify(S))});
    SYNC.last=new Date(); setSync("Zsynchronizowano o "+fmtTime(SYNC.last));
  }catch(e){ setSync("Nie udało się zsynchronizować ("+(e.code||"błąd")+")."); }
  SYNC.busy=false;
  if(SYNC.dirty){ SYNC.dirty=false; push(); }
}
function applyRemote(d){
  if(d && d.data && (d.updatedAt||0)>(S.updated||0)){
    S=merge(defaultState(), JSON.parse(JSON.stringify(d.data))); saveLocal();
    SYNC.last=new Date(); setSync("Pobrano postęp z konta o "+fmtTime(SYNC.last));
    render(); return true;
  }
  return false;
}
async function syncNow(){
  if(!SYNC.ref) return;
  const snap=await SYNC.ref.get();
  const d=snap.exists? snap.data() : null;
  if(!applyRemote(d)){
    if(!d || (S.updated||0)>(d.updatedAt||0)) await push();
    else { SYNC.last=new Date(); setSync("Zsynchronizowano o "+fmtTime(SYNC.last)); }
  }
}
async function attach(user){
  const ref=SYNC.db.collection("piano").doc(user.uid);
  SYNC.ref=ref;
  setSync("Łączę z kontem…");
  try{
    await syncNow();
    if(SYNC.ref!==ref) return;
    SYNC.unsub=ref.onSnapshot(sn=>{ if(sn.exists && !sn.metadata.hasPendingWrites) applyRemote(sn.data()); },()=>{});
  }catch(e){ if(SYNC.ref===ref) setSync("Nie udało się połączyć z kontem ("+(e.code||"błąd")+")."); }
  if(TAB==="progress") render();
}

async function initStore(){
  const local=lsGet(); if(local) S=merge(defaultState(),local);
  render();
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg){ setSync("Postęp zapisuje się na tym urządzeniu."); return; }
  if(!window.firebase){ setSync("Offline – postęp zapisuje się na tym urządzeniu."); return; }
  SYNC.configured=true;
  firebase.initializeApp(cfg);
  SYNC.auth=firebase.auth(); SYNC.db=firebase.firestore();
  SYNC.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  SYNC.auth.getRedirectResult().catch(()=>{});
  SYNC.auth.onAuthStateChanged(u=>{
    if(SYNC.unsub){ SYNC.unsub(); SYNC.unsub=null; }
    SYNC.ref=null; SYNC.user=u;
    if(u) attach(u);
    else setSync("Zaloguj się przyciskiem „Zaloguj” u góry, żeby postęp zapisywał się na koncie.");
    render();
  });
}

const clamp=(x)=>Math.max(0,Math.min(1,x));
function piecesFor(g,list){ return PIECES.filter(p=>p.g===g && (!list || p.list===list)); }
function st(id){ return (S.pieces[id]&&S.pieces[id].s)||0; }
function repProg(g){ return ["A","B","C"].reduce((a,l)=>a+Math.max(0,...piecesFor(g,l).map(p=>st(p.id)))/4,0)/3; }
function etProg(g){ const s=piecesFor(g,"E").map(p=>st(p.id)/4).sort((a,b)=>b-a); return ((s[0]||0)+(s[1]||0))/2; }
function techProg(g){ const it=TECH[g]||[]; return it.length? it.filter(i=>S.tech.done[i[0]]).length/it.length : 1; }
function srLevelLog(){ return S.sr.log.filter(x=>x.l===S.sr.level); }
function srInLevel(){ const L=srLevelLog(); if(!L.length) return 0; const last=L.slice(-5); const avg=last.reduce((a,b)=>a+b.r,0)/last.length; return clamp(L.length/20)*clamp(avg/4); }
function srCanLevelUp(){ const L=srLevelLog(); if(L.length<20) return false; const last=L.slice(-5); return last.reduce((a,b)=>a+b.r,0)/last.length>=4; }
function thInLevel(){ const t=THEORY[S.th.level]||[]; return t.length? t.filter(x=>S.th.done[x[0]]).length/t.length : 1; }
function earLevelLog(){ return S.ear.log.filter(x=>x.l===S.ear.level); }
function earAcc(){ const L=earLevelLog().slice(-30); return L.length? L.filter(x=>x.ok).length/L.length : 0; }
function earInLevel(){ const n=earLevelLog().length; return clamp(n/40)*clamp(earAcc()/0.8); }
function earCanLevelUp(){ return earLevelLog().length>=40 && earAcc()>=0.8; }
function trackOverall(level, start, inLevel, target){
  if(level>target) return 1;
  const total=target-start+1; return clamp((level-start+inLevel)/total);
}
function progress(){
  const g=S.grade;
  const parts = {
    rep:{label:"Utwory (listy A, B, C)",w:30,v:repProg(g),grp:"music"},
    et:{label:"Etiudy (2)",w:10,v:etProg(g),grp:"tech"},
    tech:{label:"Technika",w:15,v:techProg(g),grp:"tech"},
    sr:{label:"Czytanie a vista",w:15,v:trackOverall(S.sr.level,S.start.sr,srInLevel(),g),grp:"mind"},
    th:{label:"Teoria",w:20,v:trackOverall(S.th.level,S.start.th,thInLevel(),g),grp:"mind"},
    ear:{label:"Słuch",w:10,v:trackOverall(S.ear.level,S.start.ear,earInLevel(),g),grp:"mind"}
  };
  let tot=0,w=0; for(const k in parts){tot+=parts[k].v*parts[k].w; w+=parts[k].w;}
  return {parts, total:tot/w};
}

/* ============================== PLAN DNIA ============================== */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function activePiece(kind){
  const g=S.grade, lists = kind==="etude"?["E"]:["A","B","C"];
  let id=S.active[kind==="etude"?"etude":"piece"];
  if(id && st(id)<4 && PIECES.find(p=>p.id===id)) return PIECES.find(p=>p.id===id);
  // pick: first list without a finished piece, prefer one already started
  for(const l of lists){
    const ps=piecesFor(g,l);
    if(kind!=="etude" && ps.some(p=>st(p.id)>=4)) continue;
    if(kind==="etude" && ps.filter(p=>st(p.id)>=4).length>=2) return null;
    const started=ps.find(p=>st(p.id)>0 && st(p.id)<4);
    return started || ps.find(p=>st(p.id)<4) || null;
  }
  return null;
}
function genPlan(key, minutes){
  const idx=S.sessions;
  let w={warm:9,hanon:5,etude:7,sr:7,theory:6,ear:3,piece:15,free:8};
  if(idx%2===1){ w.theory=5; w.ear=5; w.free=7; }
  if(idx%6===5){ w.piece=11; w.free=13; w.hanon=3; w.etude=6; w.warm=8; } // lżejszy dzień powtórek
  if(S.grade-S.th.level>=2 && w.free>=6){ w.theory+=2; w.free-=2; }
  if(S.grade-S.sr.level>=2 && w.hanon>=5){ w.sr+=2; w.hanon-=2; }
  if(!activePiece("etude")){ w.free+=w.etude; delete w.etude; }
  if(minutes<=30){ if(idx%2===0) delete w.ear; else delete w.hanon; }
  if(!pedalCourseDone()){ w.pedal=4; w.free=Math.max(4,w.free-1); w.warm-=1; w.piece-=2; }
  const order=["warm","hanon","etude","sr","theory","ear","piece","pedal","free"].filter(k=>w[k]);
  const sum=order.reduce((a,k)=>a+w[k],0);
  let blocks=order.map(k=>({type:k, min:Math.max(3,Math.round(w[k]*minutes/sum)), done:false}));
  let diff=minutes-blocks.reduce((a,b)=>a+b.min,0);
  const big=blocks.reduce((a,b)=>b.min>a.min?b:a,blocks[0]); big.min+=diff;
  const key5=KEYS[idx%12];
  const rnd=hash(key);
  const mySorted=[...S.my].sort((a,b)=>(a.last||"").localeCompare(b.last||""));
  for(const b of blocks){
    if(b.type==="warm") b.key=idx%12;
    if(b.type==="hanon"){ b.n=S.hanon.n; }
    if(b.type==="sr"){ b.level=S.sr.level; b.book=rnd % SR[S.sr.level].books.length; }
    if(b.type==="free"){ b.items=mySorted.slice(0, b.min>=12?3:2).map(m=>m.id); }
    if(b.type==="ear"){ const ms=earModes(); b.mode = ms[idx%ms.length]; }
  }
  return {minutes, blocks, counted:false};
}
function todayPlan(){
  const k=todayKey();
  if(!S.plans[k]){ S.plans[k]=genPlan(k,S.minutes); saveLocal(); }
  return S.plans[k];
}
function markBlock(b, done){
  const plan=todayPlan();
  b.done=done;
  if(done && !plan.counted){ plan.counted=true; S.sessions++; }
  if(b.type==="hanon" && done && !b.adv){ b.adv=true; S.hanon.reps++; if(S.hanon.reps>=3){ S.hanon.reps=0; S.hanon.n = S.hanon.n>=58?1:S.hanon.n+2; } }
  if(b.type==="free" && done){ for(const id of b.items||[]){ const m=S.my.find(x=>x.id===id); if(m) m.last=todayKey(); } }
  save(); render();
}

let AC=null;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==="suspended") AC.resume(); return AC; }
const freq=(m)=>440*Math.pow(2,(m-69)/12);
function tone(m, t, dur=1.4, vol=0.22){
  const c=ac(), g=c.createGain(), o1=c.createOscillator(), o2=c.createOscillator(), g2=c.createGain();
  o1.type="triangle"; o2.type="sine"; o1.frequency.value=freq(m); o2.frequency.value=freq(m)*2; g2.gain.value=0.25;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(c.destination);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o1.start(t); o2.start(t); o1.stop(t+dur+0.05); o2.stop(t+dur+0.05);
}
function click(t, accent){
  const c=ac(), o=c.createOscillator(), g=c.createGain();
  o.frequency.value=accent?1600:1000; o.connect(g); g.connect(c.destination);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(accent?0.5:0.3,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.start(t); o.stop(t+0.06);
}
function chime(){ const c=ac(), t=c.currentTime+0.02; tone(72,t,1.2,0.25); tone(76,t+0.18,1.2,0.25); tone(79,t+0.36,1.6,0.25); }

/* metronome */
const metro={bpm:80,beats:4,on:false,next:0,beat:0,timer:null};
function metroStart(){
  const c=ac(); metro.on=true; metro.next=c.currentTime+0.06; metro.beat=0;
  metro.timer=setInterval(()=>{ while(metro.next<c.currentTime+0.12){ click(metro.next, metro.beat%metro.beats===0); const b=metro.beat%metro.beats, delay=(metro.next-c.currentTime)*1000; setTimeout(()=>lightDot(b),Math.max(0,delay)); metro.next+=60/metro.bpm; metro.beat++; onMetroBeat(); } },25);
}
function metroStop(){ metro.on=false; clearInterval(metro.timer); lightDot(-1); }
function lightDot(b){ const d=document.querySelectorAll("#dots i"); d.forEach((x,i)=>x.classList.toggle("on",i===b)); }

/* block timer */
const timerState={i:null,end:0,iv:null};
let wake=null;
async function keepAwake(){ try{ if(navigator.wakeLock) wake=await navigator.wakeLock.request("screen"); }catch(e){} }
function startTimer(i){
  stopTimer(); const b=todayPlan().blocks[i]; ac();
  timerState.i=i; timerState.end=Date.now()+b.min*60000; keepAwake();
  timerState.iv=setInterval(tickTimer,500); tickTimer(); render();
}
function stopTimer(){ clearInterval(timerState.iv); timerState.i=null; try{wake&&wake.release()}catch(e){} wake=null; }
function tickTimer(){
  if(timerState.i===null) return;
  const left=Math.max(0,timerState.end-Date.now()), el=document.getElementById("tm-"+timerState.i);
  if(el) el.textContent=Math.floor(left/60000)+":"+String(Math.floor(left/1000)%60).padStart(2,"0");
  if(left<=0){ chime(); toast("Czas minął: "+BLOCKS[todayPlan().blocks[timerState.i].type].name); stopTimer(); render(); }
}

const LET=["C","D","E","F","G","A","H"];
function staffSvg(notes, clef, sig){
  // notes: [{s:step, x}] step 0 = bottom line
  const W=320,H=150, top=45, gap=10, y=(s)=>top+40-s*5;
  let h=`<svg class="staff" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pięciolinia">`;
  for(let i=0;i<5;i++) h+=`<line x1="10" x2="${W-10}" y1="${top+i*gap}" y2="${top+i*gap}" stroke-width="1.2"/>`;
  h+= clef==="bass" ? `<text x="16" y="${top+28}" font-size="40" font-family="serif">𝄢</text>` : `<text x="14" y="${top+38}" font-size="58" font-family="serif">𝄞</text>`;
  h+=`<text x="${W-14}" y="${H-8}" font-size="11" text-anchor="end">${clef==="bass"?"klucz basowy":"klucz wiolinowy"}</text>`;
  if(sig){
    const sharpS=[8,5,9,6,3,7,4], flatS=[4,7,3,6,2,5,1];
    const arr=sig>0?sharpS:flatS, ch=sig>0?"♯":"♭";
    for(let i=0;i<Math.abs(sig);i++) h+=`<text x="${62+i*13}" y="${y(arr[i])+(sig>0?6:4)}" font-size="22" font-family="serif">${ch}</text>`;
  }
  for(const n of notes){
    for(let s=-2;s>=n.s;s-=2) h+=`<line class="ink" x1="${n.x-14}" x2="${n.x+14}" y1="${y(s)}" y2="${y(s)}" stroke-width="1.2"/>`;
    for(let s=10;s<=n.s;s+=2) h+=`<line class="ink" x1="${n.x-14}" x2="${n.x+14}" y1="${y(s)}" y2="${y(s)}" stroke-width="1.2"/>`;
    h+=`<ellipse cx="${n.x}" cy="${y(n.s)}" rx="7.5" ry="5.5" transform="rotate(-20 ${n.x} ${y(n.s)})"/>`;
  }
  return h+"</svg>";
}
const Q={type:null,cur:null,score:0,count:0,locked:false,host:null,inline:false,max:10,seq:null,onDone:null};
function quizStart(type, hostId, inline, opts){
  opts=opts||{};
  Q.type=type; Q.score=0; Q.count=0; Q.host=hostId; Q.inline=!!inline;
  Q.seq=opts.seq||null; Q.onDone=opts.onDone||null; Q.level=opts.level||null;
  Q.max=opts.max || (Q.seq? Q.seq.length : (type==="ear-clap"||type==="ear-play")? 5 : 10);
  quizNext();
}
function quizNext(){
  const host=document.getElementById(Q.host); if(!host) return;
  Q.locked=false;
  if(Q.inline && Q.count>=Q.max){
    if(Q.onDone){ const f=Q.onDone; Q.onDone=null; Q.seq=null; f(Q.score,Q.max); return; }
    host.innerHTML=`<p><b>Wynik: ${Q.score} z ${Q.max}.</b> ${Q.score>=Q.max*0.8?"Świetnie!":"Spróbuj jeszcze raz jutro."}</p><button class="btn sm" data-act="quiz-again">Jeszcze raz</button>`;
    return;
  }
  if(Q.seq) Q.type=Q.seq[Math.min(Q.count,Q.seq.length-1)];
  if(EXTRA_QUIZ[Q.type]){ EXTRA_QUIZ[Q.type](host); return; }
  const t=Q.type; let q;
  if(t==="ear-int"||t==="ear-chord"){
    const E=EAR[earLvl()];
    if(t==="ear-int"){ const semi=E.ints[Math.floor(Math.random()*E.ints.length)], root=55+Math.floor(Math.random()*12); q={answer:INT_NAMES[semi],opts:E.ints.map(s=>INT_NAMES[s]),play:()=>{const c=ac(),n=c.currentTime+0.05; tone(root,n); tone(root+semi,n+0.7); tone(root,n+1.5,1.6); tone(root+semi,n+1.5,1.6);}}; }
    else { const k=E.chords[Math.floor(Math.random()*E.chords.length)], root=52+Math.floor(Math.random()*10); q={answer:k,opts:E.chords,play:()=>{const c=ac(),n=c.currentTime+0.05; CHORD_SEMIS[k].forEach((s,i)=>tone(root+s,n+i*0.35)); CHORD_SEMIS[k].forEach(s=>tone(root+s,n+CHORD_SEMIS[k].length*0.35+0.3,1.8,0.16));}}; }
    host.innerHTML=`<div class="stack"><div class="row"><button class="btn primary" data-act="q-play">▶ Odtwórz</button><span class="small muted">Pytanie ${Q.count+1}${Q.inline?" z "+Q.max:""} · wynik ${Q.score}</span></div><div class="answers wide">${q.opts.map(o=>`<button data-act="q-ans" data-a="${esc(o)}">${o}</button>`).join("")}</div></div>`;
    Q.cur=q; setTimeout(()=>q.play(),50); return;
  }
  if(t==="notes"){
    const clef=Math.random()<0.5?"treble":"bass", s=-3+Math.floor(Math.random()*15), base=clef==="treble"?2:4;
    q={answer:LET[((base+s)%7+7)%7],opts:LET,svg:staffSvg([{s,x:200}],clef)};
  }
  if(t==="keys"){
    const max=Math.min(7,Math.max(2,S.th.level+1)), k=Math.floor(Math.random()*(2*max+1))-max;
    const MAJ={0:"C-dur",1:"G-dur",2:"D-dur",3:"A-dur",4:"E-dur",5:"H-dur",6:"Fis-dur",7:"Cis-dur","-1":"F-dur","-2":"B-dur","-3":"Es-dur","-4":"As-dur","-5":"Des-dur","-6":"Ges-dur","-7":"Ces-dur"};
    const MIN={0:"a-moll",1:"e-moll",2:"h-moll",3:"fis-moll",4:"cis-moll",5:"gis-moll",6:"dis-moll",7:"ais-moll","-1":"d-moll","-2":"g-moll","-3":"c-moll","-4":"f-moll","-5":"b-moll","-6":"es-moll","-7":"as-moll"};
    const minor=Math.random()<0.4, dict=minor?MIN:MAJ, ans=dict[k];
    const pool=Object.keys(dict).filter(x=>Math.abs(+x)<=max && +x!==k).sort(()=>Math.random()-0.5).slice(0,3).map(x=>dict[x]);
    q={answer:ans,opts:[ans,...pool].sort(()=>Math.random()-0.5),svg:staffSvg([],"treble",k),prompt:minor?"Jaka to tonacja molowa?":"Jaka to tonacja durowa?"};
  }
  if(t==="intervals"){
    const NAMES=["prima","sekunda","tercja","kwarta","kwinta","seksta","septyma","oktawa"];
    const a=-1+Math.floor(Math.random()*6), d=1+Math.floor(Math.random()*7);
    q={answer:NAMES[d],opts:NAMES.slice(1),svg:staffSvg([{s:a,x:150},{s:a+d,x:220}],"treble")};
  }
  host.innerHTML=`<div class="stack">${q.svg}<p class="small" style="text-align:center">${q.prompt||(t==="notes"?"Jaka to nuta?":"Jaki to interwał?")} <span class="muted">· pytanie ${Q.count+1}${Q.inline?" z "+Q.max:""} · wynik ${Q.score}</span></p><div class="answers ${t==="notes"?"":"wide"}">${q.opts.map(o=>`<button data-act="q-ans" data-a="${esc(o)}">${o}</button>`).join("")}</div></div>`;
  Q.cur=q;
}
function quizAnswer(btn){
  if(Q.locked) return; Q.locked=true;
  const ok=btn.dataset.a===Q.cur.answer;
  btn.classList.add(ok?"right":"wrong");
  if(!ok) document.querySelectorAll(`#${Q.host} [data-act="q-ans"]`).forEach(b=>{ if(b.dataset.a===Q.cur.answer) b.classList.add("right"); });
  quizStep(ok, ok?600:1400);
}
// One answered question: score, ear log, finishing today's ear block, next question.
function quizStep(ok, delay){
  Q.count++; if(ok) Q.score++;
  if(Q.type.startsWith("ear") && !Q.level){ S.ear.log.push({l:S.ear.level,ok}); save(); }
  if(Q.inline && !Q.seq && Q.count>=Q.max && Q.host==="ear-inline"){
    const plan=todayPlan(), b=plan.blocks.find(x=>x.type==="ear"); if(b && !b.done){ setTimeout(()=>markBlock(b,true),900); return; }
  }
  setTimeout(quizNext, delay);
}

    case "quiz-begin": ac(); quizStart(t.dataset.q,"quiz",false); break;
    case "ear-go": ac(); quizStart("ear-"+t.dataset.mode,"ear-inline",true); break;
    case "quiz-again": quizStart(Q.type,Q.host,Q.inline); break;
    case "q-play": Q.cur&&Q.cur.play&&Q.cur.play(); break;
    case "q-ans": quizAnswer(t); break;
    case "metro": if(metro.on) metroStop(); else metroStart(); t.textContent=metro.on?"Stop":"Start"; break;
    case "bpm": metro.bpm=Math.max(30,Math.min(220,metro.bpm+(+t.dataset.d))); document.getElementById("bpm").value=metro.bpm; document.getElementById("bpm-out").textContent=metro.bpm; break;
    case "metro-inline": { const bpm=+t.dataset.bpm; if(metro.on && metro.bpm===bpm){ metroStop(); t.textContent="♩ Metronom "+bpm; } else { metro.bpm=bpm; if(metro.on) metroStop(); metroStart(); t.textContent="■ Stop ("+bpm+")"; } break; }
  }
});
document.addEventListener("change",(e)=>{
  const t=e.target; if(t.dataset.act!=="setlevel") return;
  const v=+t.value, k=t.dataset.k;
  if(k==="grade"){ S.grade=v; S.active={piece:null,etude:null}; }
  if(k==="sr"){ S.sr.level=v; S.start.sr=Math.min(S.start.sr,v); }
  if(k==="th"){ S.th.level=v; S.start.th=Math.min(S.start.th,v); }
  if(k==="ear"){ S.ear.level=v; S.start.ear=Math.min(S.start.ear,v); }
  save(); render();
});
document.addEventListener("submit",(e)=>{
  if(e.target.id!=="myform") return; e.preventDefault();
  const inp=document.getElementById("myname"), n=inp.value.trim(); if(!n){ inp.focus(); return; }
  S.my.push({id:"m"+Date.now(),name:n,last:""}); save(); render();
});

/* ============================== KONTO ============================== */
function accountCard(){
  let inner;
  if(!SYNC.configured){
    inner=`<p class="small muted">Synchronizacja nie jest jeszcze włączona. Postęp zapisuje się na tym urządzeniu.</p>`;
  } else if(!SYNC.user){
    inner=`<p class="small">Zaloguj się kontem Google – tym samym co w Arabesce. Postęp będzie wspólny na telefonie i komputerze.</p>
    <div class="row"><button class="btn primary sm" data-act="glogin">Zaloguj przez Google</button></div>`;
  } else {
    inner=`<p class="small">Zalogowana jako <b>${esc(SYNC.user.email||"")}</b>.${SYNC.last?" Ostatnia synchronizacja: "+fmtTime(SYNC.last)+".":""}</p>
    <div class="row"><button class="btn sm" data-act="syncnow">Synchronizuj teraz</button><button class="btn sm ghost" data-act="logout">Wyloguj</button></div>`;
  }
  return `<div class="card stack"><h3>Konto i synchronizacja</h3>${inner}
    <div class="row"><button class="btn sm" data-act="export">Pobierz kopię zapasową</button>
    <label class="btn sm" style="cursor:pointer">Wczytaj kopię<input type="file" id="importfile" accept="application/json,.json" hidden></label></div></div>`;
}
function authErr(e){
  const c=(e&&e.code)||"";
  if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") return null;
  if(c==="auth/unauthorized-domain") return "Ta domena nie jest dodana w Firebase (Authentication → Settings → Authorized domains).";
  if(c==="auth/network-request-failed") return "Brak internetu – spróbuj, gdy będziesz online.";
  return "Nie udało się zalogować ("+(c||"błąd")+").";
}
async function googleLogin(){
  const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  try{ await SYNC.auth.signInWithPopup(p); toast("Zalogowano"); }
  catch(e){
    if(e && (e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){ SYNC.auth.signInWithRedirect(p); return; }
    const m=authErr(e); if(m) toast(m);
  }
}
function exportState(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="plan-przy-pianinie-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
document.addEventListener("click", async (e)=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act;
  if(act==="glogin") googleLogin();
  if(act==="acct"){
    if(!SYNC.user){ googleLogin(); return; }
    TAB="progress"; render(); window.scrollTo(0,0);
  }
  if(act==="logout"){ await SYNC.auth.signOut(); toast("Wylogowano – postęp zostaje na tym urządzeniu"); }
  if(act==="syncnow"){ try{ await syncNow(); }catch(err){ setSync("Nie udało się zsynchronizować ("+(err.code||"błąd")+")."); } render(); }
  if(act==="export") exportState();
});
document.addEventListener("change",(e)=>{
  if(e.target.id!=="importfile") return;
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o || typeof o.grade!=="number" || !o.plans) throw new Error("bad");
      S=merge(defaultState(), o); save(); render(); toast("Wczytano kopię zapasową");
    }catch(err){ toast("To nie jest plik kopii z tej aplikacji"); }
  };
  r.readAsText(f);
});

/* ============================== INSTALACJA ============================== */
let installEvt=null;
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
function installHidden(){ try{ return localStorage.getItem("ppp-install-hide")==="1"; }catch(e){ return false; } }
window.addEventListener("beforeinstallprompt",(e)=>{ e.preventDefault(); installEvt=e; if(TAB==="today") render(); });
window.addEventListener("appinstalled",()=>{ installEvt=null; toast("Zainstalowano – aplikacja jest na ekranie głównym"); render(); });
function installCard(){
  if(isStandalone()) return "";
  if(installEvt) return `<div class="card spread"><div style="min-width:0;flex:1"><h3>Zainstaluj aplikację</h3><p class="small muted" style="margin:0">Ikona na ekranie, pełny ekran i działanie offline.</p></div><button class="btn primary" data-act="install">Zainstaluj</button></div>`;
  if(installHidden()) return "";
  return `<details class="card"><summary>Jak zainstalować aplikację?</summary><div class="stack small" style="margin-top:8px;gap:8px">
    <p style="margin:0">Chrome nie pokazuje teraz przycisku instalacji. Spróbuj z menu Chrome: <b>⋮ → Zainstaluj aplikację</b> albo <b>⋮ → Dodaj do ekranu głównego</b>.</p>
    <p style="margin:0">Jeśli Chrome pisze, że aplikacja jest już zainstalowana, a nie da się jej otworzyć:</p>
    <ol class="tips" style="margin:0">
      <li>Ustawienia telefonu → Aplikacje → wyszukaj „Pianino” i „Plan przy pianinie” → Odinstaluj.</li>
      <li>Chrome → ⋮ → Ustawienia → Ustawienia witryn → Wszystkie witryny → matjan00.github.io → Wyczyść i zresetuj.</li>
      <li>Uruchom telefon ponownie i otwórz tę stronę jeszcze raz – pojawi się tu przycisk „Zainstaluj”.</li>
    </ol>
    <div><button class="btn sm ghost" data-act="install-hide">Nie pokazuj więcej</button></div>
  </div></details>`;
}
document.addEventListener("click", async (e)=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  if(t.dataset.act==="install" && installEvt){
    const ev=installEvt; installEvt=null;
    ev.prompt();
    try{ const c=await ev.userChoice; if(c.outcome!=="accepted") installEvt=null; }catch(err){}
    render();
  }
  if(t.dataset.act==="install-hide"){ try{ localStorage.setItem("ppp-install-hide","1"); }catch(err){} render(); }
});

initStore();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
