}

function afterToday(){
  const ear=document.getElementById("ear-inline");
  if(ear){ const plan=todayPlan(), b=plan.blocks.find(x=>x.type==="ear"); if(b&&b.done){ ear.innerHTML=`<p class="small muted">Zrobione na dziś.</p>`; } else { ear.innerHTML=`<button class="btn sm primary" data-act="ear-go" data-mode="${ear.dataset.mode}">Zacznij (${["clap","play"].includes(ear.dataset.mode)?5:10} pytań)</button>`; } }
  if(timerState.i!==null) tickTimer();
}
function afterTools(){
  const r=document.getElementById("bpm"); r.oninput=()=>{metro.bpm=+r.value;document.getElementById("bpm-out").textContent=metro.bpm;};
  document.getElementById("beats").onchange=(e)=>{metro.meter=e.target.value; metro.beats=METERS[metro.meter].length; document.getElementById("dots").innerHTML=metroDots(); document.getElementById("bpm-unit").textContent=metroUnit();};
  const sel=document.getElementById("quizsel"); if(pendingQuiz){ sel.value=pendingQuiz; pendingQuiz=null; }
  sel.onchange=()=>quizIdle(sel.value); quizIdle(sel.value);
}
function quizIdle(type){ const host=document.getElementById("quiz"); host.innerHTML=`<button class="btn primary" data-act="quiz-begin" data-q="${type}">Zacznij</button>`; }
let pendingQuiz=null;

document.addEventListener("click",(e)=>{
  const t=e.target.closest("[data-act],[data-tab]"); if(!t) return;
  const act=t.dataset.act;
  if(!act && t.dataset.tab){ TAB=t.dataset.tab; repGrade=null; render(); window.scrollTo(0,0); return; }
  const plan=todayPlan();
  switch(act){
    case "goto": TAB=t.dataset.tab; render(); window.scrollTo(0,0); break;
    case "done": { const i=+t.dataset.i, b=plan.blocks[i];
      if(b.type==="sr" && !b.done && !b.rating){ OPEN.day=todayKey(); OPEN.i=i; if(TAB!=="today"){ TAB="today"; } render(); toast("Najpierw oceń, jak poszło (1–5)"); const g=document.querySelector('[data-act="srrate"]'); g&&g.scrollIntoView({block:"center"}); break; }
      const nowDone=!b.done;
      if(nowDone && timerState.i===i) stopTimer();
      OPEN.day=todayKey(); OPEN.i=null;
      markBlock(b,nowDone);
      if(nowDone){
        const nx=curIndex(plan), nm=BLOCKS[b.type].name.split(":")[0];
        if(TAB==="today"){ if(nx>=0) showBlock(nx,true); else { const f=document.querySelector(".finale"); f&&f.scrollIntoView({block:"start",behavior:smooth()}); } }
        toast(nx>=0? "Zrobione: "+nm+" · Teraz: "+BLOCKS[plan.blocks[nx].type].name.split(":")[0] : "Sesja skończona", {label:"Cofnij", fn:()=>{ OPEN.day=todayKey(); OPEN.i=i; markBlock(b,false); }});
      }
      break; }
    case "jump": { const i=+t.dataset.i; OPEN.day=todayKey(); OPEN.i=i; render(); showBlock(i,false); break; }
    case "open": { const i=+t.dataset.i, open=openIndex(plan); OPEN.day=todayKey(); OPEN.i=(open===i)?-1:i; render(); if(OPEN.i===i) showBlock(i,true); break; }
    case "minutes": { const m=+t.dataset.m; S.minutes=m; if(plan.blocks.some(b=>b.done)){ const np=genPlan(todayKey(),m); np.counted=plan.counted; np.blocks.forEach(nb=>{ const ob=plan.blocks.find(x=>x.type===nb.type); if(ob&&ob.done){nb.done=true;nb.rating=ob.rating;nb.adv=ob.adv;} }); S.plans[todayKey()]=np; } else S.plans[todayKey()]=genPlan(todayKey(),m); save(); render(); break; }
    case "timer": { const i=+t.dataset.i; if(timerState.i===i){stopTimer();render();} else startTimer(i); break; }
    case "status": setStage(t.dataset.id, +t.dataset.s); break;
    case "activate": { const p=PIECES.find(x=>x.id===t.dataset.id); if(p.list==="E") S.active.etude=p.id; else S.active.piece=p.id; if(!st(p.id)) S.pieces[p.id]={s:1}; save(); toast("Ustawiono w planie: "+p.name); render(); break; }
    case "repgrade": repGrade=+t.dataset.g; render(); break;
    case "mydel": { const m=S.my.find(x=>x.id===t.dataset.id); withUndo("Usunięto: "+(m?m.name:"utwór"),()=>{ S.my=S.my.filter(x=>x.id!==t.dataset.id); }); break; }
    case "srrate": { const b=plan.blocks.find(x=>x.type==="sr"); const r=+t.dataset.r; const first=!b.rating; b.rating=r;
      if(first && b.gen){ S.sr.log.push({l:S.sr.level,r,d:todayKey(),src:"gen"}); }
      else if(first){ S.sr.log.push({l:S.sr.level,r,d:todayKey()}); const L=SR[b.level]||SR[8], key="sr"+b.level+":"+L.books[b.book%L.books.length]; S.srCounter[key]=(S.srCounter[key]||0)+1; } else { const last=S.sr.log[S.sr.log.length-1]; if(last) last.r=r; }
      if(!b.done) markBlock(b,true); else { save(); render(); } break; }
    case "srup": withUndo("Czytanie a vista: poziom "+Math.min(8,S.sr.level+1),()=>{ S.sr.level=Math.min(8,S.sr.level+1); }); break;
    case "thdone": withUndo("Temat zaliczony",()=>{ S.th.done[t.dataset.id]=true; }); break;
    case "thtoggle": S.th.done[t.dataset.id]=!S.th.done[t.dataset.id]; save(); render(); break;
    case "thup": withUndo("Teoria: Level "+Math.min(8,S.th.level+1),()=>{ S.th.level=Math.min(8,S.th.level+1); }); break;
    case "earup": withUndo("Słuch: poziom "+Math.min(8,S.ear.level+1),()=>{ S.ear.level=Math.min(8,S.ear.level+1); }); break;
    case "tech": S.tech.done[t.dataset.id]=!S.tech.done[t.dataset.id]; save(); render(); break;
    case "gradeup-ask": gradeAsk=true; render(); { const y=document.querySelector('[data-act="gradeup"]'); y&&y.focus(); } break;
    case "gradeup-no": gradeAsk=false; render(); break;
    case "gradeup": gradeAsk=false; try{ localStorage.setItem("ppp-backup",JSON.stringify({at:Date.now(),s:S,why:"grade"})); }catch(err){} S.grade=Math.min(8,S.grade+1); S.active={piece:null,etude:null}; S.celebrate={grade:S.grade,d:todayKey()}; save(); render(); window.scrollTo(0,0); announce("Gratulacje! Grade "+(S.grade-1)+" zaliczony."); break;
    case "celebrate-ok": delete S.celebrate; save(); render(); break;
    case "reset-ask": document.getElementById("reset-confirm").innerHTML=`<div class="confirm"><p class="small"><b>Usunąć cały postęp i historię?</b> Aplikacja zachowa obecny stan jako kopię awaryjną na tym urządzeniu (Postęp → Konto).</p><div class="row"><button class="btn sm danger" data-act="reset-yes">Tak, zacznij od nowa</button><button class="btn sm ghost" data-act="reset-no">Anuluj</button></div></div>`; document.querySelector('[data-act="reset-no"]').focus(); break;
    case "reset-no": document.getElementById("reset-confirm").innerHTML=""; break;
    case "reset-yes": try{ localStorage.setItem("ppp-backup",JSON.stringify({at:Date.now(),s:S,why:"reset"})); }catch(err){} S=defaultState(); save(); render(); toast("Zaczynasz od nowa",{label:"Cofnij",fn:restoreBackup}); break;
    case "quiz": pendingQuiz=t.dataset.q; TAB="tools"; render(); window.scrollTo(0,0); setTimeout(()=>{const c=document.getElementById("quizcard"); c&&c.scrollIntoView({block:"start"});},50); break;
    case "quiz-begin": ac(); quizStart(t.dataset.q,"quiz",false); break;
    case "ear-go": ac(); quizStart("ear-"+t.dataset.mode,"ear-inline",true); break;
    case "quiz-again": quizStart(Q.type,Q.host,Q.inline); break;
    case "q-play": Q.cur&&Q.cur.play&&Q.cur.play(); break;
    case "q-ans": quizAnswer(t); break;
    case "metro": if(metro.on) metroStop(); else metroStart(); t.textContent=metro.on?"Stop":"Start"; t.setAttribute("aria-pressed",String(metro.on)); break;
    case "metro-off": metroStop(); document.querySelectorAll('[data-act="metro-inline"]').forEach(x=>{ x.classList.remove("primary"); x.setAttribute("aria-pressed","false"); }); renderNowbar(); break;
    case "bpm": metro.bpm=Math.max(30,Math.min(220,metro.bpm+(+t.dataset.d))); document.getElementById("bpm").value=metro.bpm; document.getElementById("bpm-out").textContent=metro.bpm; break;
    case "metro-inline": { const k=t.dataset.k, bpm=inlineBpm(k);
      if(metro.on && metro.inl===k){ metroStop(); } else { if(metro.on) metroStop(); metro.bpm=bpm; metroStart(); metro.inl=k; }
      document.querySelectorAll('[data-act="metro-inline"]').forEach(x=>{ const on=metro.on && metro.inl===x.dataset.k; x.classList.toggle("primary",on); x.setAttribute("aria-pressed",String(on)); });
      renderNowbar(); break; }
    case "mi-step": { const k=t.dataset.k, v=Math.max(30,Math.min(220,inlineBpm(k)+(+t.dataset.d))); INLINE_BPM[k]=v;
      const line=t.closest(".metroline"); line.querySelector(".mbpm").textContent=v; line.querySelector('[data-act="metro-inline"]').setAttribute("aria-label","Metronom "+v+" na minutę");
      if(metro.on && metro.inl===k) metro.bpm=v; break; }
  }
});
document.addEventListener("change",(e)=>{
  const t=e.target; if(t.dataset.act==="setstage"){ setStage(t.dataset.id,+t.value); return; }
  if(t.dataset.act!=="setlevel") return;
  const v=+t.value, k=t.dataset.k, names={grade:"Grade",sr:"Czytanie a vista: poziom",th:"Teoria: Level",ear:"Słuch: poziom"};
  withUndo(names[k]+" "+v,()=>{
    if(k==="grade"){ S.grade=v; S.active={piece:null,etude:null}; }
    if(k==="sr"){ S.sr.level=v; S.start.sr=Math.min(S.start.sr,v); }
    if(k==="th"){ S.th.level=v; S.start.th=Math.min(S.start.th,v); }
    if(k==="ear"){ S.ear.level=v; S.start.ear=Math.min(S.start.ear,v); }
  });
});
document.addEventListener("submit",(e)=>{
  if(e.target.id!=="myform") return; e.preventDefault();
  const inp=document.getElementById("myname"), n=inp.value.trim(); if(!n){ inp.focus(); return; }
  S.my.push({id:"m"+Date.now(),name:n,last:""}); save(); render();
});

/* ============================== KONTO ============================== */
function accountCard(){
  let inner;
  if(!SYNC.configured){
    inner=`<p class="small muted">Synchronizacja nie jest jeszcze włączona. Postęp zapisuje się na tym urządzeniu.</p>`;
  } else if(!SYNC.user){
    inner=`<p class="small">Zaloguj się kontem Google – tym samym co w Arabesce. Postęp będzie wspólny na telefonie i komputerze.</p>
    <div class="row"><button class="btn primary sm" data-act="glogin">Zaloguj przez Google</button></div>`;
  } else {
    inner=`<p class="small">Zalogowana jako <b>${esc(SYNC.user.email||"")}</b>.</p>
    <p class="small ${SYNC.state==="err"?"":"muted"}" id="syncmsg" role="status">${esc(SYNC.msg||"")}</p>
    <div class="row"><button class="btn sm" data-act="syncnow">Synchronizuj teraz</button><button class="btn sm ghost" data-act="logout">Wyloguj</button></div>`;
  }
  const bk=backupInfo();
  return `<div class="card stack"><h3>Konto i synchronizacja</h3>${inner}
    <div class="row"><button class="btn sm" data-act="export">Pobierz kopię zapasową</button>
    <label class="btn sm ghost" style="cursor:pointer">Wczytaj kopię z pliku…<input type="file" id="importfile" accept="application/json,.json" hidden></label></div>
    ${pendingImport?`<div class="confirm" id="import-confirm"><p><b>Wczytać tę kopię?</b></p>
      <p class="small">W pliku: ${esc(stateSummary(pendingImport))}.<br>Teraz w aplikacji: ${esc(stateSummary(S))}.</p>
      <p class="small muted">Obecny postęp zostanie zastąpiony. Aplikacja zachowa go jako kopię awaryjną na tym urządzeniu, więc możesz wrócić.</p>
      <div class="row"><button class="btn primary sm" data-act="import-yes">Zastąp postęp</button><button class="btn ghost sm" data-act="import-no">Anuluj</button></div></div>`:""}
    ${bk?`<p class="small muted">Kopia awaryjna z ${esc(bk)}. <button class="btn sm ghost" data-act="import-undo">Przywróć ją</button></p>`:""}</div>`;
}
function authErr(e){
  const c=(e&&e.code)||"";
  if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") return null;
  if(c==="auth/unauthorized-domain") return "Ta domena nie jest dodana w Firebase (Authentication → Settings → Authorized domains).";
  if(c==="auth/network-request-failed") return "Brak internetu – spróbuj, gdy będziesz online.";
  return "Nie udało się zalogować ("+(c||"błąd")+").";
}
async function googleLogin(){
  const p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"});
  try{ await SYNC.auth.signInWithPopup(p); toast("Zalogowano"); }
  catch(e){
    if(e && (e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){ SYNC.auth.signInWithRedirect(p); return; }
    const m=authErr(e); if(m) toast(m);
  }
}
function exportState(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="plan-przy-pianinie-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
document.addEventListener("click", async (e)=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act;
  if(act==="glogin") googleLogin();
  if(act==="acct"){
    if(!SYNC.user){ googleLogin(); return; }
    TAB="progress"; render(); window.scrollTo(0,0);
  }
  if(act==="logout"){ await SYNC.auth.signOut(); toast("Wylogowano – postęp zostaje na tym urządzeniu"); }
  if(act==="syncnow"){ setSync("Synchronizuję…","busy"); try{ await syncNow(); }catch(err){ setSync(syncErr(err),"err"); } render(); }
  if(act==="export") exportState();
  if(act==="import-no"){ pendingImport=null; render(); }
  if(act==="import-yes" && pendingImport){
    try{ localStorage.setItem("ppp-backup",JSON.stringify({at:Date.now(),s:S})); }catch(err){}
    S=merge(defaultState(), pendingImport); pendingImport=null; save(); render();
    toast("Wczytano kopię zapasową",{label:"Cofnij",fn:restoreBackup});
  }
  if(act==="import-undo") restoreBackup();
});
function backupInfo(){ try{ const b=JSON.parse(localStorage.getItem("ppp-backup")||"null"); return b? new Date(b.at).toLocaleString("pl-PL",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}) : null; }catch(e){ return null; } }
function restoreBackup(){
  try{ const b=JSON.parse(localStorage.getItem("ppp-backup")||"null"); if(!b) return;
    S=merge(defaultState(), b.s); localStorage.removeItem("ppp-backup"); save(); render(); toast("Przywrócono postęp z kopii awaryjnej"); }catch(e){ toast("Nie udało się przywrócić kopii awaryjnej"); }
}
document.addEventListener("change",(e)=>{
  if(e.target.id!=="importfile") return;
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o || typeof o.grade!=="number" || !o.plans) throw new Error("bad");
      pendingImport=o; render(); const c=document.getElementById("import-confirm"); if(c){ c.scrollIntoView({block:"center"}); c.querySelector("button").focus({preventScroll:true}); }
    }catch(err){ toast("Ten plik nie jest kopią z Planu przy pianinie. Wybierz plik plan-przy-pianinie-….json."); }
    e.target.value="";
  };
  r.readAsText(f);
});

/* ============================== INSTALACJA ============================== */
let installEvt=null;
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
function installHidden(){ try{ return localStorage.getItem("ppp-install-hide")==="1"; }catch(e){ return false; } }
window.addEventListener("beforeinstallprompt",(e)=>{ e.preventDefault(); installEvt=e; if(TAB==="progress") render(); });
window.addEventListener("appinstalled",()=>{ installEvt=null; toast("Zainstalowano – aplikacja jest na ekranie głównym"); render(); });
function installCard(){
  if(isStandalone()) return "";
  if(installEvt) return `<div class="card spread"><div style="min-width:0;flex:1"><h3>Zainstaluj aplikację</h3><p class="small muted" style="margin:0">Ikona na ekranie, pełny ekran i działanie offline.</p></div><button class="btn primary" data-act="install">Zainstaluj</button></div>`;
  if(installHidden()) return "";
  return `<details class="card"><summary>Jak zainstalować aplikację?</summary><div class="stack small" style="margin-top:8px;gap:8px">
    <p style="margin:0">Chrome nie pokazuje teraz przycisku instalacji. Spróbuj z menu Chrome: <b>⋮ → Zainstaluj aplikację</b> albo <b>⋮ → Dodaj do ekranu głównego</b>.</p>
    <p style="margin:0">Jeśli Chrome pisze, że aplikacja jest już zainstalowana, a nie da się jej otworzyć:</p>
    <ol class="tips" style="margin:0">
      <li>Ustawienia telefonu → Aplikacje → wyszukaj „Pianino” i „Plan przy pianinie” → Odinstaluj.</li>
      <li>Chrome → ⋮ → Ustawienia → Ustawienia witryn → Wszystkie witryny → matjan00.github.io → Wyczyść i zresetuj.</li>
      <li>Uruchom telefon ponownie i otwórz tę stronę jeszcze raz – pojawi się tu przycisk „Zainstaluj”.</li>
    </ol>
    <div><button class="btn sm ghost" data-act="install-hide">Nie pokazuj więcej</button></div>
  </div></details>`;
}
document.addEventListener("click", async (e)=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  if(t.dataset.act==="install" && installEvt){
    const ev=installEvt; installEvt=null;
    ev.prompt();
    try{ const c=await ev.userChoice; if(c.outcome!=="accepted") installEvt=null; }catch(err){}
    render();
  }
  if(t.dataset.act==="install-hide"){ try{ localStorage.setItem("ppp-install-hide","1"); }catch(err){} render(); }
});

initStore();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
